apiVersion: v1
kind: Namespace
metadata:
  name: tuckbar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: tuckbar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tuckbar-landing
  template:
    metadata:
      labels:
        app: tuckbar-landing
    spec:
      containers:
        - name: web
          image: tuckbar-landing:initial
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: tuckbar
spec:
  selector:
    app: tuckbar-landing
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuckbar
  namespace: tuckbar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tuckbar.novarock.io
      secretName: tuckbar-tls
  rules:
    - host: tuckbar.novarock.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80
